name: Solstone staged web and Team Chat typecheck

on:
  push:
    branches:
      - mobile-android-ios-test-2026-11-20
    paths:
      - '.github/workflows/web-typecheck.yml'
      - 'app/login/page.tsx'
      - 'app/api/auth/workers/route.ts'
      - 'app/team-chat/**'
      - 'app/components/TeamChatWidget.tsx'
      - 'app/components/team-chat-widget.css'
      - 'app/api/team-chat/**'
      - 'app/api/team-calls/**'
      - 'app/components/SolstoneCalls.tsx'
      - 'app/lib/team-chat.ts'
      - 'app/lib/web-push.ts'
      - 'app/api/auth/login/route.ts'
      - 'public/solstone-push-sw.js'
      - 'app/components/TeamChatAlerts.tsx'
      - 'app/dashboard/page.tsx'
      - 'app/kalendar/page.tsx'
      - 'app/api/worker/today/route.ts'
      - 'app/layout.tsx'
      - 'app/components/SolstoneAIEntry.tsx'
      - 'app/assistant/**'
      - 'app/instalacija/**'
      - 'public/manifest.json'
      - 'app/api/solstone-ai/**'
      - 'app/globals.css'
      - 'app/components/SolstoneMobileNav.tsx'
      - 'app/components/solstone-mobile-nav.css'
      - 'app/components/SolstoneAIEntry.tsx'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out isolated mobile test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate TypeScript without touching the live web app
        run: npx tsc --noEmit
      - name: Note scope
        if: always()
        run: |
          echo "Static TypeScript check of the isolated GitHub branch only." >> "$GITHUB_STEP_SUMMARY"
          echo "This does not deploy to production or change Supabase RLS." >> "$GITHUB_STEP_SUMMARY"
