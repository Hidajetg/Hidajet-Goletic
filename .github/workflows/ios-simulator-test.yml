name: Solstone iPhone - unsigned simulator build

on:
  push:
    branches:
      - mobile-android-ios-test-2026-11-20
    paths:
      - '.github/workflows/ios-simulator-test.yml'
      - 'mobile/scripts/patch_ios_privacy.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solstone-ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      SOLSTONE_WEB_URL: https://hidajet-goletic-frno.vercel.app
    steps:
      - name: Checkout test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Inspect Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Install mobile dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false @capacitor/ios@8.6.2 @capacitor/core@8.6.2 @capacitor/cli@8.6.2 --no-audit --no-fund

      - name: Build fallback web files
        run: npm run build

      - name: Create iOS platform using Capacitor 8 SPM
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Protect iOS screen recording and app-switcher previews
        shell: bash
        run: |
          python3 scripts/patch_ios_privacy.py
          grep -F "installSolstonePrivacyShield(scene)" ios/App/App/SceneDelegate.swift
          grep -F "UIScreen.capturedDidChangeNotification" ios/App/App/SceneDelegate.swift

      - name: Declare camera and microphone reasons for chat media
        shell: bash
        run: |
          plist="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSMicrophoneUsageDescription string Solstone uses your microphone only when you record a voice message.' "$plist"
          /usr/libexec/PlistBuddy -c 'Add :NSCameraUsageDescription string Solstone uses your camera only when you attach a Baustelle photo.' "$plist"
          /usr/libexec/PlistBuddy -c 'Add :NSPhotoLibraryUsageDescription string Solstone lets you select Baustelle images for chat messages.' "$plist"

      - name: Validate remote web URL and bundle identifier
        shell: bash
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const app = JSON.parse(fs.readFileSync('ios/App/App/capacitor.config.json','utf8'));
          if (app.server?.url !== process.env.SOLSTONE_WEB_URL) {
            throw new Error('Wrong iOS web URL: ' + JSON.stringify(app.server));
          }
          if (app.appId !== 'com.solstone.baustelle') {
            throw new Error('Unexpected iOS application identifier');
          }
          console.log('iOS uses the same hosted web UI and PIN login.');
          JS

      - name: Prepare approved test app icon
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/solstone-ios-icon-env"
          "$RUNNER_TEMP/solstone-ios-icon-env/bin/python" -m pip install --disable-pip-version-check Pillow==11.3.0
          "$RUNNER_TEMP/solstone-ios-icon-env/bin/python" scripts/generate_mobile_icons.py
          icons="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$icons"
          cp branding/generated/ios/AppIcon-1024-TEST-ONLY.png "$icons/AppIcon-512@2x.png"
          cat > "$icons/Contents.json" <<'JSON'
          {
            "images": [{"filename":"AppIcon-512@2x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],
            "info": {"author":"xcode","version":1}
          }
          JSON

      - name: Compile unsigned iOS simulator application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/solstone-ios-derived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/solstone-ios-build.log"

      - name: Package simulator app (NOT an IPA)
        shell: bash
        run: |
          APP="$RUNNER_TEMP/solstone-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist"
          cd "$(dirname "$APP")"
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/solstone-ios-SIMULATOR-unsigned.zip"

      - name: Launch unsigned app on available iPhone simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(python3 - <<'PY'
          import json
          import subprocess
          payload = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          devices = [item for group in payload["devices"].values() for item in group]
          iphones = [device for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")]
          if not iphones:
              raise SystemExit("No iPhone simulator installed on macOS runner")
          print(iphones[0]["udid"])
          PY
          )
          echo "Booting simulator $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          if ! python3 - "$DEVICE" <<'PY'
          import subprocess, sys
          try:
              subprocess.run(["xcrun","simctl","bootstatus",sys.argv[1],"-b"],
                             check=True,timeout=160)
          except (subprocess.TimeoutExpired, subprocess.CalledProcessError) as exc:
              print("iPhone simulator not ready:",str(exc))
              sys.exit(1)
          PY
          then
            echo "::warning::iPhone simulator boot timed out; unsigned iOS compile/package still passed."
            exit 0
          fi
          APP="$RUNNER_TEMP/solstone-ios-derived/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.solstone.baustelle
          sleep 10
          xcrun simctl io "$DEVICE" screenshot "$GITHUB_WORKSPACE/solstone-ios-login-simulator.png"
          test -s "$GITHUB_WORKSPACE/solstone-ios-login-simulator.png"
          echo "### iOS simulator smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "Unsigned app installed and launched on an iPhone simulator; screenshot uploaded for manual review." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iPhone simulator screenshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solstone-ios-login-screenshot-${{ github.run_number }}
          path: solstone-ios-login-simulator.png
          retention-days: 7
          if-no-files-found: warn

      - name: Upload iOS simulator artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solstone-ios-simulator-unsigned-${{ github.run_number }}
          path: solstone-ios-SIMULATOR-unsigned.zip
          retention-days: 7
          if-no-files-found: error

      - name: Explain limitations
        if: always()
        run: |
          echo "### iOS simulator-only test" >> "$GITHUB_STEP_SUMMARY"
          echo "This is not an installable iPhone IPA and cannot be distributed to real iPhones." >> "$GITHUB_STEP_SUMMARY"
          echo "Real-device testing and release require Apple signing credentials and authorized provisioning." >> "$GITHUB_STEP_SUMMARY"
          echo "Store publishing stays last, after all functionality is verified." >> "$GITHUB_STEP_SUMMARY"
