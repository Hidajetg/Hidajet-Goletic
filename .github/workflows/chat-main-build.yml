name: Solstone chat-only original app full build

on:
  push:
    branches:
      - solstone-chat-only-2026-11-21
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: compile-only-public-key
      SUPABASE_SERVICE_ROLE_KEY: compile-only-server-key
      APP_SESSION_SECRET: compile-only-unusable-secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout chat-only extension based on production main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install fixed dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Production Next.js build with fake keys only
        run: npm run build
      - name: Assert secured chat and excluded calling
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs=require('fs');
          const auth=fs.readFileSync('app/lib/team-chat.ts','utf8');
          const post=fs.readFileSync('app/api/team-chat/auth/route.ts','utf8');
          const view=fs.readFileSync('app/team-chat/page.tsx','utf8');
          const root=fs.readFileSync('app/layout.tsx','utf8');
          if(!auth.includes('solstone_chat_auth') || !auth.includes('session.id !== chatSession.id')) process.exit(1);
          if(!post.includes('bcrypt.compare') || !post.includes('MAX_ATTEMPTS')) process.exit(1);
          const login=fs.readFileSync('app/api/auth/login/route.ts','utf8');
          const session=fs.readFileSync('app/lib/admin-session.ts','utf8');
          if(!root.includes('TeamChatWidget') || view.includes('unlockChat') || !login.includes('verifiedPersonalPin') || !session.includes('session.purpose !== "chat"')) process.exit(1);
          if(root.includes('<SolstoneCalls') || view.includes('solstone-call-start')) process.exit(1);
          const manifest=JSON.parse(fs.readFileSync('.next/server/app-paths-manifest.json','utf8'));
          const paths=Object.keys(manifest);
          for(const slug of ['/team-chat/page','/api/team-chat/messages/route','/api/team-chat/auth/route']){
            if(!paths.some(p=>p.includes(slug))) {
              console.error('Missing built route',slug);process.exit(1);
            }
          }
          console.log('Chat-only secure PIN integration and Next.js routes verified');
          JS
      - name: Test scope
        if: always()
        run: |
          {
            echo '## Chat-only build against original Solstone main'
            echo 'Static code and full Next.js build only; dummy keys, no production data changes.'
            echo 'Publish only after database, login, mobile media and RLS checks.'
          } >> "$GITHUB_STEP_SUMMARY"
