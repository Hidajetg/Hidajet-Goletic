name: Solstone Android – stable signed update APK

# The first signed install establishes the signing identity. Subsequent runs
# preserve the package ID and signing certificate while increasing versionCode.
# No signing key or password is committed to Git.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solstone-android-stable-updates
  cancel-in-progress: false

jobs:
  signed-android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      SOLSTONE_WEB_URL: https://hidajet-goletic-frno.vercel.app
      # Never use the standalone Vite demo for this persistent release identity.

    steps:
      - name: Checkout reviewed Solstone test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require all four signing secrets before building
        env:
          KEYSTORE_B64: ${{ secrets.SOLSTONE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SOLSTONE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOLSTONE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOLSTONE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing is not configured. Set the four SOLSTONE_* signing secrets in GitHub Actions Settings; see mobile/STABLE_UPDATES.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/solstone-release.jks"
          chmod 600 "$RUNNER_TEMP/solstone-release.jks"
          test -s "$RUNNER_TEMP/solstone-release.jks"

      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - name: Compute monotonic Android version
        shell: bash
        run: |
          set -euo pipefail
          code=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "SOLSTONE_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "SOLSTONE_VERSION_NAME=1.0.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build fallback assets
        run: npm run build

      - name: Embed existing HTTPS Solstone web app
        run: npx cap sync android

      - name: Check stable package identity, code and HTTPS origin
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('android/app/src/main/assets/capacitor.config.json','utf8'));
          if (config.appId !== 'com.solstone.baustelle') throw Error('Unexpected application ID');
          if (config.server?.url !== process.env.SOLSTONE_WEB_URL ||
              config.server?.cleartext !== false) throw Error('Unexpected URL or non-HTTPS connection');
          const gradle = fs.readFileSync('android/app/build.gradle','utf8');
          if (!gradle.includes('applicationId "com.solstone.baustelle"')) throw Error('Stable Android package was modified');
          if (!gradle.includes('SOLSTONE_VERSION_CODE')) throw Error('versionCode CI override missing');
          const java = fs.readFileSync('android/app/src/main/java/com/solstone/baustelle/MainActivity.java','utf8');
          if (java.includes('addFlags(WindowManager.LayoutParams.FLAG_SECURE)')) throw Error('Screenshot blocking unexpectedly enabled');
          JS

      - name: Build unsigned Android release for signing
        run: bash ./gradlew --no-daemon --console=plain :app:assembleRelease
        working-directory: mobile/android

      - name: Zipalign, sign and verify APK with the same permanent key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SOLSTONE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOLSTONE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOLSTONE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.SOLSTONE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          tool_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$tool_dir/zipalign"
          test -x "$tool_dir/apksigner"
          "$tool_dir/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/solstone-aligned.apk"
          mkdir -p "$RUNNER_TEMP/solstone-distribution"
          final="$RUNNER_TEMP/solstone-distribution/Solstone-Baustelle-v$SOLSTONE_VERSION_NAME.apk"
          "$tool_dir/apksigner" sign \
            --ks "$RUNNER_TEMP/solstone-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$final" "$RUNNER_TEMP/solstone-aligned.apk"
          "$tool_dir/apksigner" verify --verbose "$final"
          # Compare the signing identity against the pinned fingerprint if
          # configured after the first signed release.
          cert=$("$tool_dir/apksigner" verify --print-certs "$final" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr '[:upper:]' '[:lower:]')
          test -n "$cert"
          if [ -n "$EXPECTED_CERT_SHA256" ] &&
             [ "$cert" != "$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::Signing certificate does not match pinned fingerprint. Refusing incompatible update."
            exit 1
          fi
          unzip -p "$final" assets/capacitor.config.json | grep -F "$SOLSTONE_WEB_URL" >/dev/null
          sha256sum "$final"
          printf 'appId=com.solstone.baustelle\nversionCode=%s\nversionName=%s\ncertificateSHA256=%s\nwebOrigin=%s\n' \
            "$SOLSTONE_VERSION_CODE" "$SOLSTONE_VERSION_NAME" "$cert" "$SOLSTONE_WEB_URL" \
            > "$RUNNER_TEMP/solstone-distribution/BUILD-INFO.txt"
          echo "### Solstone signed Android update" >> "$GITHUB_STEP_SUMMARY"
          echo "- Application ID: com.solstone.baustelle" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version code: $SOLSTONE_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signature SHA-256: $cert" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native changes require this signed APK; hosted web changes load from the server." >> "$GITHUB_STEP_SUMMARY"
          echo "- Internal test only: not a certified Google Play / App Store release." >> "$GITHUB_STEP_SUMMARY"
          echo "- Chat remains unavailable until the protected server chat schema is deployed and verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK and non-secret metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solstone-stable-upgrade-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solstone-distribution/*
          if-no-files-found: error
          retention-days: 60

      - name: Explain missing artifact on failure
        if: failure()
        run: |
          echo "## Solstone signed APK not produced" >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect the first failing job step. No unsigned or debug-signed APK is offered as an upgrade." >> "$GITHUB_STEP_SUMMARY"
