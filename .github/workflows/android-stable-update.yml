name: Solstone Android – stable signed update APK

# The first signed install establishes the signing identity. Subsequent runs
# preserve the package ID and signing certificate while increasing versionCode.
# No signing key or password is committed to Git.
on:
  push:
    branches:
      - mobile-android-ios-test-2026-11-20
    paths:
      - '.github/workflows/android-stable-update.yml'
      - 'mobile/android/**'
      - 'mobile/capacitor.config.ts'
      - 'mobile/branding/**'
      - 'mobile/scripts/generate_mobile_icons.py'
      - 'app/lib/notification-audio.ts'
  workflow_dispatch:
    inputs:
      approved_run_id:
        description: 'Optional: publish an already tested signed build run ID to automatic update channel'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: solstone-android-stable-updates
  cancel-in-progress: false

jobs:
  signed-android-apk:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.approved_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      SOLSTONE_WEB_URL: https://hidajet-goletic-frno.vercel.app
      # Never use the standalone Vite demo for this persistent release identity.

    steps:
      - name: Checkout reviewed Solstone test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require all four signing secrets before building
        env:
          KEYSTORE_B64: ${{ secrets.SOLSTONE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SOLSTONE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOLSTONE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOLSTONE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] ||
             [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Signing is not configured. Set the four SOLSTONE_* signing secrets in GitHub Actions Settings; see mobile/STABLE_UPDATES.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/solstone-release.jks"
          chmod 600 "$RUNNER_TEMP/solstone-release.jks"
          test -s "$RUNNER_TEMP/solstone-release.jks"

      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - name: Verify original signing certificate before costly build
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SOLSTONE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOLSTONE_KEY_ALIAS }}
          EXPECTED_CERT_SHA256: ${{ vars.SOLSTONE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          cert=$(keytool -exportcert \
            -keystore "$RUNNER_TEMP/solstone-release.jks" \
            -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD \
            | sha256sum | awk '{print $1}')
          expected=$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          echo "Signing certificate SHA-256: $cert"
          echo "Configured fingerprint SHA-256: $expected"
          if [ -z "$expected" ] || [ "$cert" != "$expected" ]; then
            echo "::error::Pinned signing certificate fingerprint mismatch. Do not skip validation."
            exit 1
          fi

      - name: Compute monotonic Android version
        shell: bash
        run: |
          set -euo pipefail
          code=$((10000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "SOLSTONE_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "SOLSTONE_VERSION_NAME=1.0.$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate approved Solstone launcher icons
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/generate_mobile_icons.py

      - name: Configure Android Firebase project if available
        env:
          FCM_CONFIG: ${{ secrets.SOLSTONE_ANDROID_FCM_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$FCM_CONFIG" ]; then
            printf '%s' "$FCM_CONFIG" | base64 --decode > android/app/google-services.json
            node -e 'const c=require("./android/app/google-services.json");if(!c.client?.some(x=>x.client_info?.android_client_info?.package_name==="com.solstone.baustelle"))process.exit(1)'
            echo "SOLSTONE_NATIVE_PUSH_CONFIGURED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Firebase configuration missing; this APK does not support live native push yet."
            echo "SOLSTONE_NATIVE_PUSH_CONFIGURED=false" >> "$GITHUB_ENV"
          fi

      - name: Build fallback assets
        run: npm run build

      - name: Embed existing HTTPS Solstone web app
        run: npx cap sync android

      - name: Check stable package identity, code and HTTPS origin
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('android/app/src/main/assets/capacitor.config.json','utf8'));
          if (config.appId !== 'com.solstone.baustelle') throw Error('Unexpected application ID');
          if (config.server?.url !== process.env.SOLSTONE_WEB_URL ||
              config.server?.cleartext !== false) throw Error('Unexpected URL or non-HTTPS connection');
          const gradle = fs.readFileSync('android/app/build.gradle','utf8');
          if (!gradle.includes('applicationId "com.solstone.baustelle"')) throw Error('Stable Android package was modified');
          if (!gradle.includes('SOLSTONE_VERSION_CODE')) throw Error('versionCode CI override missing');
          const java = fs.readFileSync('android/app/src/main/java/com/solstone/baustelle/MainActivity.java','utf8');
          if (java.includes('addFlags(WindowManager.LayoutParams.FLAG_SECURE)')) throw Error('Screenshot blocking unexpectedly enabled');
          JS

      - name: Build unsigned Android release for signing
        run: bash ./gradlew --no-daemon --console=plain :app:assembleRelease
        working-directory: mobile/android

      - name: Zipalign, sign and verify APK with the same permanent key
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SOLSTONE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOLSTONE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOLSTONE_KEY_PASSWORD }}
          EXPECTED_CERT_SHA256: ${{ vars.SOLSTONE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          tool_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$tool_dir/zipalign"
          test -x "$tool_dir/apksigner"
          "$tool_dir/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/solstone-aligned.apk"
          mkdir -p "$RUNNER_TEMP/solstone-distribution"
          final="$RUNNER_TEMP/solstone-distribution/Solstone-Baustelle-v$SOLSTONE_VERSION_NAME.apk"
          "$tool_dir/apksigner" sign \
            --ks "$RUNNER_TEMP/solstone-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$final" "$RUNNER_TEMP/solstone-aligned.apk"
          "$tool_dir/apksigner" verify --verbose "$final"
          # Compare the signing identity against the pinned fingerprint if
          # configured after the first signed release.
          # apksigner's --print-certs wording differs across installed build-tools.
          # Hash the signing key's exported DER certificate directly instead:
          # apksigner has just verified the APK signed with this keystore.
          cert=$(keytool -exportcert \
            -keystore "$RUNNER_TEMP/solstone-release.jks" \
            -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD \
            | sha256sum | awk '{print $1}')
          test -n "$cert"
          if [ -n "$EXPECTED_CERT_SHA256" ] &&
             [ "$cert" != "$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')" ]; then
            echo "::error::Signing certificate does not match pinned fingerprint. Refusing incompatible update."
            exit 1
          fi
          unzip -p "$final" assets/capacitor.config.json | grep -F "$SOLSTONE_WEB_URL" >/dev/null
          sha256sum "$final"
          python3 -c 'import json,os,sys,hashlib; p=sys.argv[1]; print(json.dumps(dict(appId="com.solstone.baustelle",versionCode=int(os.environ["SOLSTONE_VERSION_CODE"]),versionName=os.environ["SOLSTONE_VERSION_NAME"],sha256=hashlib.sha256(open(p,"rb").read()).hexdigest(),size=os.path.getsize(p))))' "$final" > "$RUNNER_TEMP/solstone-distribution/solstone-update.json"
          printf 'appId=com.solstone.baustelle\nversionCode=%s\nversionName=%s\ncertificateSHA256=%s\nwebOrigin=%s\n' \
            "$SOLSTONE_VERSION_CODE" "$SOLSTONE_VERSION_NAME" "$cert" "$SOLSTONE_WEB_URL" \
            > "$RUNNER_TEMP/solstone-distribution/BUILD-INFO.txt"
          printf 'nativePushConfigured=%s\n' "$SOLSTONE_NATIVE_PUSH_CONFIGURED" >> "$RUNNER_TEMP/solstone-distribution/BUILD-INFO.txt"
          echo "### Solstone signed Android update" >> "$GITHUB_STEP_SUMMARY"
          echo "- Application ID: com.solstone.baustelle" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version code: $SOLSTONE_VERSION_CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signature SHA-256: $cert" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firebase Android config included: $SOLSTONE_NATIVE_PUSH_CONFIGURED" >> "$GITHUB_STEP_SUMMARY"
          echo "- Native changes require this signed APK; hosted web changes load from the server." >> "$GITHUB_STEP_SUMMARY"
          echo "- Internal test only: not a certified Google Play / App Store release." >> "$GITHUB_STEP_SUMMARY"
          echo "- Chat remains unavailable until the protected server chat schema is deployed and verified." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK and non-secret metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solstone-stable-upgrade-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/solstone-distribution/*
          if-no-files-found: error
          retention-days: 60

      - name: Explain missing artifact on failure
        if: failure()
        run: |
          echo "## Solstone signed APK not produced" >> "$GITHUB_STEP_SUMMARY"
          echo "Inspect the first failing job step. No unsigned or debug-signed APK is offered as an upgrade." >> "$GITHUB_STEP_SUMMARY"

  publish-approved-update:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.approved_run_id != '' && github.ref_name == 'mobile-android-ios-test-2026-11-20' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPROVED_RUN: ${{ inputs.approved_run_id }}
      EXPECTED_CERT: ${{ vars.SOLSTONE_CERT_SHA256 }}
    steps:
      - name: Download exact successful signed build and verify public release assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APPROVED_RUN" =~ ^[0-9]+$ ]]
          [[ "$GH_REPO" == "Hidajetg/Hidajet-Goletic" ]]
          expected_workflow=$(gh api "repos/$GH_REPO/actions/workflows/android-stable-update.yml" --jq .id)
          gh api "repos/$GH_REPO/actions/runs/$APPROVED_RUN" > run.json
          jq -e --argjson id "$expected_workflow" '.workflow_id==$id and .conclusion=="success" and .head_branch=="mobile-android-ios-test-2026-11-20"' run.json >/dev/null
          gh run download "$APPROVED_RUN" --pattern 'solstone-stable-upgrade-*' --dir approved
          mapfile -t manifests < <(find approved -name solstone-update.json)
          test "${#manifests[@]}" = 1
          dir=$(dirname "${manifests[0]}")
          manifest="$dir/solstone-update.json"
          name=$(jq -er '.versionName | select(test("^1[.]0[.][0-9]{1,7}[.][0-9]{1,3}$"))' "$manifest")
          code=$(jq -er '.versionCode | numbers' "$manifest")
          apk="$dir/Solstone-Baustelle-v$name.apk"
          test -s "$apk"
          grep -Fx 'nativePushConfigured=true' "$dir/BUILD-INFO.txt"
          grep -Fx "versionName=$name" "$dir/BUILD-INFO.txt"
          grep -Fx "versionCode=$code" "$dir/BUILD-INFO.txt"
          jq -e --arg hash "$(sha256sum "$apk" | cut -d' ' -f1)" --argjson size "$(stat -c %s "$apk")" '.appId=="com.solstone.baustelle" and .sha256==$hash and .size==$size' "$manifest" >/dev/null
          tool_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)
          cert=$("$tool_dir/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          expected=$(printf '%s' "$EXPECTED_CERT" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')
          test -n "$expected"
          test "$cert" = "$expected"
          "$tool_dir/aapt" dump badging "$apk" | grep -F "package: name='com.solstone.baustelle' versionCode='$code' versionName='$name'"
          # Only move the release channel forward; refuse to overwrite existing releases.
          latest=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
          if [[ -n "$latest" ]]; then
            [[ "$latest" =~ ^android-v1[.]0[.]([0-9]+)[.]([0-9]+)$ ]]
            previous=$((10000+10#${BASH_REMATCH[1]}*100+10#${BASH_REMATCH[2]}))
            test "$code" -gt "$previous"
          fi
          tag="android-v$name"
          sha=$(jq -r .head_sha run.json)
          gh release create "$tag" "$apk" "$manifest" --draft --target "$sha" --title "Solstone Baustelle $name" --notes "Approved signed Android update. Installation requires Android confirmation."
          gh release edit "$tag" --draft=false --latest
          echo "Published approved Android update $name" >> "$GITHUB_STEP_SUMMARY"
