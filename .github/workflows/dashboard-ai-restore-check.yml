name: Verify restored dashboard and Solstone AI (no release)

on:
  push:
    branches:
      - fix/restore-dashboard-ai-keep-chat-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: compile-only-public-key
      SUPABASE_SERVICE_ROLE_KEY: compile-only-server-key
      APP_SESSION_SECRET: compile-only-unusable-secret
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build Next.js with dummy keys
        run: npm run build
      - name: Verify dashboard and chat remain intact
        run: |
          node <<'JS'
          const fs = require('fs');
          const dashboard = fs.readFileSync('app/dashboard/page.tsx','utf8');
          const root = fs.readFileSync('app/layout.tsx','utf8');
          const css = fs.readFileSync('app/dashboard/restored-menu.css','utf8');
          const ai = fs.readFileSync('app/api/solstone-ai/route.ts','utf8');
          if(!dashboard.includes('solstone-restored-menu')) throw Error('Restored grid missing');
          if(!css.includes('repeat(4') || !css.includes('repeat(2')) throw Error('Responsive columns missing');
          if(!root.includes('<TeamChatWidget />') || !root.includes('<TeamChatAlerts />')) throw Error('Team Chat removed');
          if(!root.includes('<SolstoneAIEntry />')) throw Error('AI entry missing');
          if(!ai.includes('SOLSTONE_AI_ENABLED') || !ai.includes('getChatUser()')) throw Error('AI safety missing');
          console.log('Restored dashboard, chat preservation, AI entry and gated API verified');
          JS
