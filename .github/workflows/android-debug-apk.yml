name: Solstone Android debug APK

on:
  push:
    branches:
      - mobile-android-ios-test-2026-11-20
    paths:
      - 'mobile/**'
      - '.github/workflows/android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    env:
      # Publishable browser key only. NEVER add a service_role or secret API key.
      VITE_SUPABASE_URL: https://axpfymarrqjebpwosidr.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_9Ik1i7_zuJ8bIZaWOgZ_CA_k8ysbEJW

    steps:
      - name: Check out test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Configure JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      - name: Install locked JavaScript dependencies
        id: dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$RUNNER_TEMP/solstone-dependencies.log"

      - name: Build bundled Vite web assets
        id: web
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/solstone-web.log"

      - name: Sync web assets into Android
        id: sync
        shell: bash
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee "$RUNNER_TEMP/solstone-sync.log"

      - name: Verify packaged frontend is not blank
        id: verify_web
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/capacitor.config.json
          if grep -R -q '10.0.2.2:3000' android/app/src/main/assets/capacitor.config.json; then
            echo "::error::Emulator-only URL found in packaged Android config"
            exit 1
          fi
          test -n "$(find android/app/src/main/assets/public/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          echo "Bundled frontend and Android assets verified."

      - name: Assemble debug APK with diagnostic logs
        id: gradle
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --stacktrace --console=plain assembleDebug 2>&1 | tee "$RUNNER_TEMP/solstone-gradle.log"
        working-directory: mobile/android

      - name: Verify APK output
        id: verify_apk
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -p "$APK" assets/public/index.html > /dev/null
          echo "APK contains bundled web app."
          sha256sum "$APK"

      - name: Explain failed stage in job summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Android debug build failed'
            echo ''
            echo 'Open the first failed step above. Expand its log and copy the error lines (omit secrets).'
            echo 'If the failure is in npm, inspect the **Install locked JavaScript dependencies** or **Build bundled Vite web assets** step.'
            echo 'If the failure is in Gradle, inspect **Assemble debug APK with diagnostic logs**.'
            echo 'The build is a test APK only; the web production app has not been changed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test APK
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solstone-android-debug-${{ github.run_number }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Report build result in commit status
        if: always()
        shell: bash
        working-directory: mobile
        env:
          GH_TOKEN: ${{ github.token }}
          DEPS: ${{ steps.dependencies.outcome }}
          WEB: ${{ steps.web.outcome }}
          SYNC: ${{ steps.sync.outcome }}
          VERIFY_WEB: ${{ steps.verify_web.outcome }}
          GRADLE: ${{ steps.gradle.outcome }}
          VERIFY_APK: ${{ steps.verify_apk.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          phases = [
              ("dependencies", "npm ci", "solstone-dependencies.log"),
              ("web", "Vite build", "solstone-web.log"),
              ("sync", "Capacitor sync", "solstone-sync.log"),
              ("verify_web", "bundled assets", ""),
              ("gradle", "Gradle", "solstone-gradle.log"),
              ("verify_apk", "APK validation", ""),
              ("upload", "artifact upload", ""),
          ]
          outcomes = {name: os.getenv(name.upper(), "") for name, _, _ in phases}
          failed = next(((name, label, log) for name, label, log in phases if outcomes[name] == "failure"), None)
          state, description = "success", "Android debug APK built and uploaded"
          if failed:
              state = "failure"
              _, label, logfile = failed
              description = label + " failed"
              if logfile:
                  path = os.path.join(os.environ["RUNNER_TEMP"], logfile)
                  if os.path.exists(path):
                      lines = open(path, encoding="utf8", errors="replace").read().splitlines()
                      error_lines = [l.strip() for l in lines if re.search(r'(error TS\d+|npm error|Error:|FAILURE:|What went wrong|failed with|Could not|not found)', l, re.I)]
                      if error_lines:
                          detail = next((l for l in error_lines if re.search(r'(error TS\d+|npm error|Error:|Could not)', l, re.I)), error_lines[-1])
                          detail = re.sub(r'sb_publishable_[A-Za-z0-9_-]+|eyJ[A-Za-z0-9._-]+', '[redacted]', detail)
                          description = (label + ": " + detail)[:140]
          elif any(outcomes[name] not in ("success",) for name, _, _ in phases):
              state, description = "error", "Android workflow did not finish all build steps"
          data = json.dumps({"state":state,"context":"Solstone Android diagnostic","description":description[:140],
                             "target_url":f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"}).encode()
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}"
          req = urllib.request.Request(url, data=data, method="POST", headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"
          })
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print("Diagnostic commit status created:", resp.status, description)
          except Exception as exc:
              print("Could not publish diagnostic status:", str(exc))
          PY
