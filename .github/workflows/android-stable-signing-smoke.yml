name: Solstone update signing – throwaway CI smoke only

# Compiles a release and proves zipalign/apksigner logic works without needing
# the owner's permanent signing secrets. No APK is uploaded or distributed.
on:
  push:
    branches:
      - mobile-android-ios-test-2026-11-20
    paths:
      - '.github/workflows/android-stable-signing-smoke.yml'
      - '.github/workflows/android-stable-update.yml'
      - 'mobile/android/app/build.gradle'
      - 'mobile/capacitor.config.ts'

permissions:
  contents: read

jobs:
  test-release-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    env:
      SOLSTONE_WEB_URL: https://hidajet-goletic-frno.vercel.app
      SOLSTONE_VERSION_CODE: '19999'
      SOLSTONE_VERSION_NAME: '1.0-smoke'
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: JDK 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Install and package
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync android
      - name: Assemble unsigned release
        working-directory: mobile/android
        run: bash ./gradlew --no-daemon --console=plain :app:assembleRelease
      - name: Verify upgrade APK signing process with disposable test key
        shell: bash
        run: |
          set -euo pipefail
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$tools/apksigner"
          test -x "$tools/zipalign"
          keytool -genkeypair -keystore "$RUNNER_TEMP/THROWAWAY-DONT-USE.jks" \
            -storetype PKCS12 -alias ci_test -keyalg RSA -keysize 2048 \
            -validity 1 -dname "CN=THROWAWAY-DO-NOT-USE" \
            -storepass temporary_not_a_real_key -keypass temporary_not_a_real_key
          "$tools/zipalign" -f -p 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign \
            --ks "$RUNNER_TEMP/THROWAWAY-DONT-USE.jks" \
            --ks-key-alias ci_test \
            --ks-pass pass:temporary_not_a_real_key \
            --key-pass pass:temporary_not_a_real_key \
            --out "$RUNNER_TEMP/throwaway.apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --verbose "$RUNNER_TEMP/throwaway.apk"
          unzip -p "$RUNNER_TEMP/throwaway.apk" assets/capacitor.config.json | grep -F "$SOLSTONE_WEB_URL"
          echo "Release signing process passed. Test key and APK are NOT distributed." >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm no permanent APK is being published
        if: always()
        run: |
          echo "This workflow never uploads an APK. A permanent private signing key is required for user upgrades." >> "$GITHUB_STEP_SUMMARY"
